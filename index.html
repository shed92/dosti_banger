<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>दोस्ती बैंगर — Chai ki Tapri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@400;500;600;700;800&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sindoor: #B8272C;
    --sindoor-deep: #7A1B1F;
    --indigo: #131B3A;
    --turmeric: #F5A400;
    --marigold: #E8641C;
    --cream: #F4E6C8;
    --charcoal: #201620;
    --glass: rgba(20,10,14,0.45);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    background: var(--indigo);
    font-family: 'Poppins', sans-serif;
    color: var(--cream);
    overflow-x:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  .stage{
    position:relative;
    min-height:100vh;
    width:100%;
    background-image:
      linear-gradient(180deg, rgba(10,6,14,0.55) 0%, rgba(10,6,14,0.15) 30%, rgba(10,6,14,0.25) 60%, rgba(10,6,14,0.85) 100%),
      url('chai-tapri-bg.jpg');
    background-size: cover;
    background-position: center 30%;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom:170px;
  }

  /* ---------- Hero panel: dark glass card behind title so text stays legible on any photo ---------- */
  .heroPanel{
    align-self:flex-start;
    margin: 26px 24px 0;
    padding: 26px 28px 24px;
    max-width: 640px;
    background: rgba(10,6,10,0.55);
    backdrop-filter: blur(10px) saturate(120%);
    -webkit-backdrop-filter: blur(10px) saturate(120%);
    border: 1px solid rgba(244,230,200,0.14);
    border-radius: 22px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    z-index:3;
  }

  /* ---------- Title block ---------- */
  .titleWrap{
    text-align:left;
    z-index:3;
  }
  .eyebrow{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    letter-spacing:.35em;
    text-transform:uppercase;
    font-size: 12px;
    color: var(--turmeric);
    margin-bottom: 10px;
  }
  h1.hindi{
    font-family:'Yatra One', cursive;
    font-size: clamp(52px, 13vw, 118px);
    line-height: 1.02;
    color: var(--cream);
    text-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 14px 34px rgba(0,0,0,0.45);
    letter-spacing: 1px;
  }
  .tagline{
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size: clamp(14px, 2.4vw, 18px);
    color: rgba(244,230,200,0.9);
    max-width: 480px;
    margin: 14px 0 0;
    line-height:1.6;
  }
  .tagline b{ color: var(--turmeric); font-weight:700; }

  /* ---------- Scene spacer: lets the photo show through below the title/stats ---------- */
  .sceneSpacer{
    width:100%;
    flex: 1 1 auto;
    min-height: 34vh;
  }

  /* ---------- badges ---------- */
  .stats{
    display:flex; gap:26px; margin-top:20px; z-index:3;
    font-family:'Baloo 2', sans-serif;
  }
  .stat{ text-align:left; }
  .stat .n{ font-size:22px; font-weight:700; color:var(--turmeric); }
  .stat .l{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:rgba(244,230,200,0.7); }
  .dot-online{ width:9px; height:9px; border-radius:50%; background:#38D66B; display:inline-block; box-shadow:0 0 8px #38D66B; margin-right:6px; }

  /* ---------- Player ---------- */
  .playerDock{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:center;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    z-index: 20;
    pointer-events:none;
  }
  .player{
    pointer-events:auto;
    width:100%; max-width: 560px;
    background: linear-gradient(135deg, rgba(90,20,26,0.72), rgba(20,10,14,0.72));
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(244,230,200,0.16);
    border-radius: 999px;
    padding: 10px 18px 10px 10px;
    display:flex; align-items:center; gap:14px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.45);
  }
  .discWrap{
    position:relative; width:52px; height:52px; flex:0 0 auto;
  }
  .disc{
    width:52px; height:52px; border-radius:50%;
    background: conic-gradient(from 0deg, #2B1418, #4A1E22, #2B1418, #4A1E22, #2B1418);
    display:flex; align-items:center; justify-content:center;
    animation: spin 6s linear infinite paused;
    box-shadow: inset 0 0 0 2px rgba(244,230,200,0.15);
  }
  .disc.spinning{ animation-play-state: running; }
  .disc .hole{ width:14px; height:14px; border-radius:50%; background: var(--turmeric); box-shadow: 0 0 0 3px rgba(20,10,14,0.6); }
  @keyframes spin{ to{ transform: rotate(360deg);} }

  .meta{ flex:1 1 auto; min-width:0; }
  .track{ font-weight:700; font-size:14.5px; color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .artist{ font-size:12px; color: rgba(244,230,200,0.68); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
  .progressRow{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .progressBar{ flex:1; height:4px; border-radius:2px; background: rgba(244,230,200,0.22); overflow:hidden; cursor:pointer; }
  .progressFill{ height:100%; width:0%; background: linear-gradient(90deg, var(--turmeric), var(--marigold)); border-radius:2px; }
  .time{ font-size:10px; color: rgba(244,230,200,0.6); min-width:64px; text-align:right; font-variant-numeric: tabular-nums; }

  .controls{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .ctrlBtn{
    background:none; border:none; cursor:pointer; color: var(--cream);
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:50%;
    opacity:.85; transition: opacity .15s, transform .15s;
  }
  .ctrlBtn:hover{ opacity:1; transform: scale(1.08); }
  .playBtn{
    width:42px; height:42px; background: var(--cream); color:var(--sindoor-deep);
    box-shadow: 0 6px 14px rgba(0,0,0,0.35);
  }
  .playBtn:hover{ transform: scale(1.06); }
  .spotifyMark{
    width:20px;height:20px; flex:0 0 auto; opacity:.75;
  }

  footer{
    margin-top: 30px; padding-bottom: 6px;
    font-size:11px; color: rgba(244,230,200,0.45);
    letter-spacing:.06em;
    z-index:3;
    text-align:center;
  }

  @media (max-width: 480px){
    .stats{ gap:18px; }
    .player{ padding:8px 14px 8px 8px; }
    .track{ font-size:13.5px; }
    .navbar{ padding:14px 16px; }
  }

  /* ---------- Top nav: outbound platform links ---------- */
  .navbar{
    width:100%;
    display:flex; align-items:center; justify-content:flex-end;
    gap:10px;
    padding: 18px 24px;
    z-index:4;
  }
  .platformLink{
    display:flex; align-items:center; gap:7px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(20,10,14,0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(244,230,200,0.18);
    color: var(--cream);
    text-decoration:none;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size: 12.5px;
    transition: transform .15s, background .15s;
  }
  .platformLink:hover{ transform: translateY(-1px); background: rgba(20,10,14,0.72); }
  .platformLink svg{ width:16px; height:16px; flex:0 0 auto; }
</style>
</head>
<body>

<div class="stage">

  <div class="navbar">
    <a class="platformLink" href="https://open.spotify.com/playlist/6pta3N6Es4jv2TX7vayqAA?si=VSKiO_D4QBuK2Y2zg6jwLw&utm_source=copy-link&pi=yBcNVnD5Q-eD_&sci=spotify%3Acard-config%3A2mOSFyxc17gN0J22RhuM3P" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#1ED760"><circle cx="12" cy="12" r="12"/><path d="M17.5 10.8c-3-1.8-8-2-10.9-1.1-.5.1-1-.1-1.1-.6-.1-.5.1-1 .6-1.1 3.3-1 8.8-.8 12.3 1.3.4.3.5.8.3 1.2-.3.4-.8.5-1.2.3zM16.4 13.7c-2.5-1.5-6.3-2-9.3-1.1-.4.1-.8-.1-.9-.5-.1-.4.1-.8.5-.9 3.4-1 7.6-.5 10.5 1.2.3.2.4.7.2 1s-.7.4-1 .3zM15.4 16.6c-2.1-1.3-4.8-1.6-7.9-.9-.3.1-.7-.1-.7-.4-.1-.3.1-.7.4-.7 3.4-.8 6.4-.4 8.8 1.1.3.2.4.5.2.8-.2.2-.5.3-.8.1z" fill="#0B1A10"/></svg>
      Spotify
    </a>
    <a class="platformLink" href="https://music.youtube.com/playlist?list=PLBBAZGPNSYXVrxyJuoIYYcsEhxZwIV61y&si=zP18AvKKgoE0_5TM" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#FF0000"><circle cx="12" cy="12" r="12"/><path d="M9.5 8v8l7-4-7-4z" fill="#fff"/></svg>
      YT Music
    </a>
  </div>

  <div class="heroPanel">
    <div class="titleWrap">
      <div class="eyebrow"><span class="dot-online"></span>31 यार टपरी पे</div>
      <h1 class="hindi">दोस्ती<br>बैंगर</h1>
      <p class="tagline">गली के नुक्कड़ की <b>टपरी</b>, कटिंग चाय के कश और यारों की महफ़िल का साउंडट्रैक।</p>
    </div>

    <div class="stats">
      <div class="stat"><div class="n">42</div><div class="l">Yaar</div></div>
      <div class="stat"><div class="n">128</div><div class="l">Bangers</div></div>
      <div class="stat"><div class="n">∞</div><div class="l">Cutting Chai</div></div>
    </div>
  </div>

  <div class="sceneSpacer"></div>
  <footer>दोस्ती बैंगर · मुंबई की हर टपरी का अपना रेडियो</footer>
</div>

<!-- Player dock -->
<div class="playerDock">
  <div class="player">
    <div class="discWrap">
      <div class="disc" id="disc"><div class="hole"></div></div>
    </div>
    <div class="meta">
      <div class="track" id="trackName">Loading playlist…</div>
      <div class="artist" id="trackArtist">Dosti Banger Radio</div>
      <div class="progressRow">
        <div class="progressBar" id="progressBar"><div class="progressFill" id="progressFill"></div></div>
        <div class="time" id="timeLabel">0:00 / 0:00</div>
      </div>
    </div>
    <div class="controls">
      <button class="ctrlBtn" id="prevBtn" aria-label="Previous track" title="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
      </button>
      <button class="ctrlBtn playBtn" id="playBtn" aria-label="Play" title="Play">
        <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrlBtn" id="nextBtn" aria-label="Next track" title="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
      </button>
    </div>
    <svg class="spotifyMark" viewBox="0 0 24 24" fill="#1ED760" title="Spotify-style player">
      <circle cx="12" cy="12" r="12"/>
      <path d="M17.5 10.8c-3-1.8-8-2-10.9-1.1-.5.1-1-.1-1.1-.6-.1-.5.1-1 .6-1.1 3.3-1 8.8-.8 12.3 1.3.4.3.5.8.3 1.2-.3.4-.8.5-1.2.3zM16.4 13.7c-2.5-1.5-6.3-2-9.3-1.1-.4.1-.8-.1-.9-.5-.1-.4.1-.8.5-.9 3.4-1 7.6-.5 10.5 1.2.3.2.4.7.2 1s-.7.4-1 .3zM15.4 16.6c-2.1-1.3-4.8-1.6-7.9-.9-.3.1-.7-.1-.7-.4-.1-.3.1-.7.4-.7 3.4-.8 6.4-.4 8.8 1.1.3.2.4.5.2.8-.2.2-.5.3-.8.1z" fill="#0B1A10"/>
    </svg>
  </div>
</div>

<!-- hidden YouTube player: powers real audio, no login needed for visitors -->
<div id="ytHost" style="position:fixed; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;"></div>

<script>
  // ---- Real playback via YouTube IFrame API, sourced from your YT Music playlist ----
  const YT_PLAYLIST_ID = 'PLBBAZGPNSYXVrxyJuoIYYcsEhxZwIV61y';

  let ytPlayer = null;
  let ytReady = false;
  let playing = false;
  let progressTimer = null;

  const disc = document.getElementById('disc');
  const playBtn = document.getElementById('playBtn');
  const trackName = document.getElementById('trackName');
  const trackArtist = document.getElementById('trackArtist');
  const progressFill = document.getElementById('progressFill');
  const progressBar = document.getElementById('progressBar');
  const timeLabel = document.getElementById('timeLabel');

  function fmt(s){
    if(!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s/60), r = Math.floor(s%60);
    return m+':'+String(r).padStart(2,'0');
  }

  function setPlayIcon(isPlaying){
    document.getElementById('playIcon').outerHTML = isPlaying
      ? '<svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
      : '<svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  }

  function updateNowPlayingInfo(){
    if(!ytPlayer || !ytPlayer.getVideoData) return;
    const data = ytPlayer.getVideoData();
    if(data && data.title){
      trackName.textContent = data.title;
      trackArtist.textContent = data.author || 'YouTube Music';
    }
  }

  function startProgressLoop(){
    clearInterval(progressTimer);
    progressTimer = setInterval(()=>{
      if(!ytPlayer || !ytPlayer.getCurrentTime) return;
      const cur = ytPlayer.getCurrentTime() || 0;
      const dur = ytPlayer.getDuration() || 0;
      const pct = dur ? Math.min(100,(cur/dur)*100) : 0;
      progressFill.style.width = pct+'%';
      timeLabel.textContent = fmt(cur)+' / '+fmt(dur);
    }, 500);
  }

  // Loads the YouTube IFrame API script
  const ytScript = document.createElement('script');
  ytScript.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(ytScript);

  // Safety net: if the API/script gets blocked (ad-blockers, network issues), don't leave the UI stuck silently
  setTimeout(()=>{
    if(!ytReady){
      trackName.textContent = 'Player failed to load';
      trackArtist.textContent = 'Check your connection / ad-blocker';
    }
  }, 8000);

  window.onYouTubeIframeAPIReady = function(){
    ytPlayer = new YT.Player('ytHost', {
      height: '1', width: '1',
      playerVars: {
        listType: 'playlist',
        list: YT_PLAYLIST_ID,
        autoplay: 0,
        playsinline: 1,
        origin: window.location.origin
      },
      events: {
        onReady: function(){
          ytReady = true;
          trackName.textContent = 'Ready — press play';
          trackArtist.textContent = 'Dosti Banger Radio';
        },
        onStateChange: function(e){
          if(e.data === YT.PlayerState.PLAYING){
            playing = true;
            disc.classList.add('spinning');
            setPlayIcon(true);
            startProgressLoop();
            setTimeout(updateNowPlayingInfo, 300);
          } else if(e.data === YT.PlayerState.PAUSED){
            playing = false;
            disc.classList.remove('spinning');
            setPlayIcon(false);
            clearInterval(progressTimer);
          } else if(e.data === YT.PlayerState.CUED){
            setTimeout(updateNowPlayingInfo, 300);
          } else if(e.data === YT.PlayerState.ENDED){
            // playlist wraps automatically, but keep UI in sync
            setTimeout(updateNowPlayingInfo, 300);
          }
        },
        onError: function(e){
          // 2=bad param, 5=html5 error, 100=not found, 101/150=embedding disabled
          // Skip the broken track instead of getting stuck
          trackName.textContent = 'Skipping unavailable track…';
          if(ytPlayer && ytPlayer.nextVideo){
            ytPlayer.nextVideo();
            if(playing) setTimeout(()=>{ ytPlayer.playVideo(); }, 400);
          }
        }
      }
    });
  };

  playBtn.addEventListener('click', ()=>{
    if(!ytReady) return;
    if(playing){ ytPlayer.pauseVideo(); }
    else { ytPlayer.playVideo(); }
  });

  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(!ytReady) return;
    ytPlayer.nextVideo();
    if(!playing) ytPlayer.playVideo();
  });

  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(!ytReady) return;
    ytPlayer.previousVideo();
    if(!playing) ytPlayer.playVideo();
  });

  progressBar.addEventListener('click', (e)=>{
    if(!ytReady || !ytPlayer.getDuration) return;
    const rect = progressBar.getBoundingClientRect();
    const pct = (e.clientX-rect.left)/rect.width;
    const dur = ytPlayer.getDuration() || 0;
    ytPlayer.seekTo(Math.max(0, Math.min(dur, pct*dur)), true);
  });
</script>

</body>
</html>
